<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flip The Coin</title>
        <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <h1>Flip the coin</h1>
            <p class="para">press the coin or the button to flip the coin</p>
            <div class="coin-container">
                <button id="coin" type="button" aria-label="flip the coin">
                    <img class="coin-image" src="flip-the-coin-master/flip-the-coin-master/resources/heads.svg" alt="heads">
                </button>
                <img class="shadow" src="flip-the-coin-master/flip-the-coin-master/resources/shadow.svg" alt="shadow">
            </div>
            <p id="result">Heads</p>
            <button class="random">Random</button>
            <script src="main.js"></script>
        </main>
    </body>
</html>
